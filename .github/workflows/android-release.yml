name: Android Release Build

# Builds a SIGNED release APK and AAB on every push and on demand.
# The keystore never lives in the repo: it is decoded at runtime from a base64
# GitHub Secret and deleted before the job ends (even on failure). Secrets are
# passed through the environment only and are never printed.
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   EchoOrchardKeystoreBase64  - base64 of the release .jks keystore
#   EchoOrchardStorePassword   - keystore (store) password
#   EchoOrchardKeyPassword     - key password
#   EchoOrchardKeyAlias        - key alias

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the game is tested with locally. Bump it on
          # purpose (and match android/ to that Flutter's template) rather than
          # letting "latest" break the build.
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.EchoOrchardKeystoreBase64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret EchoOrchardKeystoreBase64."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/echoorchard-release.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.EchoOrchardStorePassword }}
          KEY_PASSWORD: ${{ secrets.EchoOrchardKeyPassword }}
          KEY_ALIAS: ${{ secrets.EchoOrchardKeyAlias }}
        run: |
          {
            echo "storeFile=echoorchard-release.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Remove signing material
        if: always()
        run: rm -f android/app/echoorchard-release.jks android/key.properties

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: echo-orchard-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: echo-orchard-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
